
name: Build Zyrenz APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          unzip -q Zyrenz-Frame-Generator-GitHub-Build.zip -d source
          test -f source/zyrenz-frame-generator/app/build.gradle
          cd source/zyrenz-frame-generator
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zyrenz-Frame-Generator-APK
          path: source/zyrenz-frame-generator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
